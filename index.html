            saveGame() {
                const saveData = {
                    player: {
                        x: game.player.x,
                        y: game.player.y,
                        z: game.player.z,
                        yaw: game.player.yaw,
                        pitch: game.player.pitch,
                        health: game.player.health,
                        hunger: game.player.hunger,
                        inventory: game.player.inventory,
                        hotbarSlot: game.player.hotbarSlot
                    },
                    world: {
                        seed: game.world.seed,
                        time: game.world.time
                    },
                    settings: {
                        mode: game.mode,
                        difficulty: game.difficulty,
                        renderDistance: game.graphics.renderDistance,
                        fov: game.graphics.fov,
                        sensitivity: game.sensitivity
                    }
                };
                
                localStorage.setItem('minecraft-save', JSON.stringify(saveData));
                alert('✅ Spiel gespeichert!');
            }

            loadGame() {
                const savedData = localStorage.getItem('minecraft-save');
                if (savedData) {
                    try {
                        const data = JSON.parse(savedData);
                        Object.assign(game.player, data.player);
                        Object.assign(game.world, data.world);
                        if (data.settings) {
                            game.mode = data.settings.mode;
                            game.difficulty = data.settings.difficulty;
                            game.graphics.renderDistance = data.settings.renderDistance;
                            game.graphics.fov = data.settings.fov;
                            game.sensitivity = data.settings.sensitivity;
                            
                            // Update UI
                            document.getElementById('gamemode-select').value = game.mode;
                            document.getElementById('difficulty-select').value = game.difficulty;
                            document.getElementById('render-distance').value = game.graphics.renderDistance;
                            document.getElementById('render-value').textContent = game.graphics.renderDistance;
                            document.getElementById('fov-slider').value = game.graphics.fov;
                            document.getElementById('fov-value').textContent = game.graphics.fov;
                            document.getElementById('sensitivity-slider').value = game.sensitivity;
                            document.getElementById('sensitivity-value').textContent = game.sensitivity;
                        }
                        console.log('Spielstand geladen!');
                    } catch (error) {
                        console.error('Fehler beim Laden:', error);
                    }
                }
            }

            updateInfo() {
                document.getElementById('fps-counter').textContent = `FPS: ${game.fps}`;
                document.getElementById('position').textContent = 
                    `X: ${Math.floor(game.player.x)}, Y: ${Math.floor(game.player.y)}, Z: ${Math.floor(game.player.z)}`;
                
                const time = game.world.time % 24000;
                const hours = Math.floor((time / 1000) + 6) % 24;
                const minutes = Math.floor((time % 1000) / 16.67);
                const timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
                document.getElementById('time').textContent = `Zeit: ${timeStr}`;
                
                // Determine biome
                const y = Math.floor(game.player.y);
                let biome = 'Plains';
                if (y < 58) biome = 'Beach';
                else if (y > 80) biome = 'Mountains';
                document.getElementById('biome').textContent = `Biom: ${biome}`;
                
                // Update health
                const hearts = document.querySelectorAll('.heart');
                hearts.forEach((heart, i) => {
                    heart.classList.toggle('empty', i >= game.player.health / 2);
                });
                
                const foods = document.querySelectorAll('.food');
                foods.forEach((food, i) => {
                    food.classList.toggle('empty', i >= game.player.hunger / 2);
                });
            }
        }

        // Game Engine (Improved)
        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d', { alpha: false });
                this.renderer = new Renderer(this.canvas, this.ctx);
                this.physics = new Physics();
                this.uiManager = new UIManager();
                this.inputHandler = new InputHandler();
                
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            async start() {
                await loadTextures();
                
                // Load saved game
                this.uiManager.loadGame();
                
                // Generate initial chunks
                worldManager.loadChunksAround(game.player.x, game.player.z, 4);
                
                // Give starting items
                if (game.player.inventory.length === 0) {
                    game.player.inventory.push(BLOCKS.DIRT, BLOCKS.DIRT, BLOCKS.DIRT);
                    game.player.inventory.push(BLOCKS.WOOD, BLOCKS.WOOD);
                    game.player.inventory.push(BLOCKS.STONE, BLOCKS.STONE);
                }
                this.inputHandler.updateHotbar();
                
                document.getElementById('loading').classList.add('hidden');
                
                game.running = true;
                game.lastTime = performance.now();
                this.loop();
            }

            loop(currentTime = 0) {
                if (!game.running) return;
                
                const deltaTime = Math.min((currentTime - game.lastTime) / 1000, 0.1); // Cap delta
                game.lastTime = currentTime;
                
                // FPS counter
                game.frameCount++;
                if (currentTime - game.lastFpsUpdate > 1000) {
                    game.fps = game.frameCount;
                    game.frameCount = 0;
                    game.lastFpsUpdate = currentTime;
                }
                
                if (!game.paused) {
                    this.physics.update(deltaTime);
                    game.world.time += 0.5; // Day/night cycle
                    if (game.world.time >= 24000) game.world.time = 0;
                    
                    // Load chunks periodically
                    if (Math.random() < 0.02) {
                        const radius = Math.ceil(game.graphics.renderDistance / 16) + 2;
                        worldManager.loadChunksAround(game.player.x, game.player.z, radius);
                        worldManager.unloadDistantChunks(game.player.x, game.player.z, radius + 2);
                    }
                }
                
                this.renderer.render();
                this.uiManager.updateInfo();
                
                requestAnimationFrame((t) => this.loop(t));
            }
        }

        // Start Game
        window.addEventListener('load', () => {
            const gameEngine = new GameEngine();
            gameEngine.start();
        });

        // Prevent defaults
        window.addEventListener('contextmenu', (e) => e.preventDefault());
        document.body.addEventListener('touchmove', (e) => {
            if (e.target === document.getElementById('gameCanvas')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
